services:
  redis:
    image: redis:7-alpine
    container_name: guworld-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: ghcr.io/vippro67/guworld-backend:latest
    container_name: guworld-backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - DB_HOST=ls-19158de3f63de849869984a18834806cd5e6215a.c52mq4a6of6b.ap-southeast-1.rds.amazonaws.com
      - DB_PORT=5432
      - DB_USER=gu_admin
      - DB_PASSWORD=cKsQD[ER&.z=1Xe$,+9KaH+#0vmen^~h
      - DB_NAME=gu_db
      - DB_SSLMODE=require
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - JWT_SECRET=guworld_cultivation_secret_key_change_me
      - CORS_ALLOWED_ORIGINS=https://www.cogioi.io.vn,https://cogioi.io.vn
        - AUTH_COOKIE_DOMAIN=.cogioi.io.vn
      - AUTH_COOKIE_SECURE=true
      - AUTH_COOKIE_SAMESITE=none
      - WS_ALLOWED_ORIGINS=http://localhost:3000,https://cogioi.io.vn,https://www.cogioi.io.vn,https://api.cogioi.io.vn
    depends_on:
      redis:
        condition: service_started

  # frontend:
  #   image: ghcr.io/vippro67/guworld-frontend:latest
  #   container_name: guworld-frontend
  #   restart: always
  #   environment:
  #     - INTERNAL_BACKEND_URL=http://backend:8080
  #   depends_on:
  #     - backend

  caddy:
    image: caddy:2-alpine
    container_name: guworld-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  alloy:
    image: grafana/alloy:latest
    container_name: guworld-alloy
    restart: always
    environment:
      - LOKI_URL=https://logs-prod-020.grafana.net/loki/api/v1/push
      - LOKI_USER=1492959
      - PROMETHEUS_URL=https://prometheus-prod-37-prod-ap-southeast-1.grafana.net/api/prom/push
      - PROMETHEUS_USER=2994568
      - GRAFANA_API_KEY=glc_eyJvIjoiMTY3NzU0OCIsIm4iOiJ2aXBwcm82NyIsImsiOiIxUTBOOTIyaXFrOXM2b0ZhYjUyNGJvR1ciLCJtIjp7InIiOiJwcm9kLWFwLXNvdXRoZWFzdC0xIn19
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy

volumes:
  redis_data:
  caddy_data:
  caddy_config: