services:
  db:
    image: postgres:15-alpine
    container_name: guworld-db
    restart: always
    environment:
      POSTGRES_USER: gu_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}"
      POSTGRES_DB: gu_db
      TZ: Asia/Ho_Chi_Minh
    command:
      - postgres
      - -c
      - timezone=Asia/Ho_Chi_Minh
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=200
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - wal_buffers=16MB
    # Loopback only: the backend reaches this over the compose network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gu_admin -d gu_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: guworld-redis
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    # Loopback only: the backend reaches this over the compose network.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/vippro67/guworld-backend:latest}
    container_name: guworld-backend
    restart: always
    # 443/tcp is HTTPS (REST + WebTransport upgrade); 443/udp is QUIC/WebTransport.
    ports:
      - "443:8443/tcp"
      - "443:8443/udp"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - GIN_MODE=release
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - CORS_ALLOWED_ORIGINS=https://www.cogioi.io.vn,https://cogioi.io.vn,http://localhost:3000
      - AUTH_COOKIE_DOMAIN=.cogioi.io.vn
      - AUTH_COOKIE_SECURE=true
      - AUTH_COOKIE_SAMESITE=none
      # HTTPS + WebTransport in the same Go process (Caddy removed).
      - TLS_ENABLED=${TLS_ENABLED:-true}
      - TLS_ADDR=:8443
      - WT_ENABLED=${WT_ENABLED:-true}
      - WT_ADDR=:8443
      - TLS_CERT_FILE=/data/certs/fullchain.pem
      - TLS_KEY_FILE=/data/certs/privkey.pem
    volumes:
      # Certificates live on the host (certbot/acme.sh) and are mounted read-only.
      - ./certs:/data/certs:ro
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_started
    # Give in-flight WebTransport sessions time to receive close code 4010 and
    # for the HTTP server to drain before Docker sends SIGKILL.
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://127.0.0.1:8443/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s


volumes:
  redis_data:
  postgres_data:
