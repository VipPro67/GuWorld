services:
  db:
    image: postgres:15-alpine
    container_name: guworld-db
    restart: always
    environment:
      POSTGRES_USER: gu_admin
      POSTGRES_PASSWORD: gu_pass_123
      POSTGRES_DB: gu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
