services:
  redis:
    image: redis:7-alpine
    container_name: guworld-redis
    restart: always
    volumes:
      - redis_data:/data

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/vippro67/guworld-backend:latest}
    container_name: guworld-backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - GIN_MODE=release
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - CORS_ALLOWED_ORIGINS=https://www.cogioi.io.vn,https://cogioi.io.vn,http://localhost:3000
      - AUTH_COOKIE_DOMAIN=.cogioi.io.vn
      - AUTH_COOKIE_SECURE=true
      - AUTH_COOKIE_SAMESITE=none
      - WS_ALLOWED_ORIGINS=http://localhost:3000,https://cogioi.io.vn,https://www.cogioi.io.vn,https://api.cogioi.io.vn
    depends_on:
      redis:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: guworld-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  alloy:
    image: grafana/alloy:latest
    container_name: guworld-alloy
    restart: always
    environment:
      - LOKI_URL=${LOKI_URL}
      - LOKI_USER=${LOKI_USER}
      - PROMETHEUS_URL=${PROMETHEUS_URL}
      - PROMETHEUS_USER=${PROMETHEUS_USER}
      - GRAFANA_API_KEY=${GRAFANA_API_KEY}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
