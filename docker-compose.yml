services:
  redis:
    image: redis:7-alpine
    container_name: guworld-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: ghcr.io/vippro67/guworld-backend:latest
    container_name: guworld-backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - DB_HOST=ls-19158de3f63de849869984a18834806cd5e6215a.c52mq4a6of6b.ap-southeast-1.rds.amazonaws.com
      - DB_PORT=5432
      - DB_USER=gu_admin
      - DB_PASSWORD=cKsQD[ER&.z=1Xe$,+9KaH+#0vmen^~h
      - DB_NAME=gu_db
      - DB_SSLMODE=require
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false
      - JWT_SECRET=guworld_cultivation_secret_key_change_me
      - CORS_ALLOWED_ORIGINS=https://www.cogioi.io.vn,https://cogioi.io.vn,http://localhost:3000
    depends_on:
      redis:
        condition: service_started

  frontend:
    image: ghcr.io/vippro67/guworld-frontend:latest
    container_name: guworld-frontend
    restart: always
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: guworld-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  redis_data:
  caddy_data:
  caddy_config: