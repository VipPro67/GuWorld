name: Deploy Backend to AWS Lightsail

on:
  push:
    branches:
      - deploy
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: guworld-production
  cancel-in-progress: true

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...

  build-backend:
    needs: backend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/vippro67/guworld-backend:latest
            ghcr.io/vippro67/guworld-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to AWS Lightsail
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22

          script: |
            set -e

            cd /home/${{ secrets.LIGHTSAIL_USERNAME }}/GuWorld

            git fetch origin deploy
            git reset --hard origin/deploy

            echo "${{ secrets.GITHUB_TOKEN }}" |
            docker login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

            export BACKEND_IMAGE="ghcr.io/vippro67/guworld-backend:${{ github.sha }}"
            docker compose pull backend

            docker compose up -d --no-deps backend

            # Wait for the new process to answer HTTPS on 127.0.0.1:8443.
            # --resolve keeps SNI/Host aligned with the certificate while
            # bypassing DNS/Cloudflare for the origin check.
            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 \
                --resolve api.cogioi.io.vn:443:127.0.0.1 \
                https://api.cogioi.io.vn/api/health >/dev/null; then
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Backend health check failed" >&2
                docker compose logs --tail=100 backend >&2
                exit 1
              fi
              sleep 2
            done

            # QUIC reachability: the HTTP/3 alt-svc advertisement and UDP
            # listener. Fails loudly if the UDP port was not published.
            curl -fsS --max-time 5 --http3-only \
              --resolve api.cogioi.io.vn:443:127.0.0.1 \
              https://api.cogioi.io.vn/api/health >/dev/null || \
              echo "WARN: HTTP/3 probe failed; check UDP 443 firewall/publish"

            docker image prune -f

            echo "Deploy completed"
            docker compose ps
