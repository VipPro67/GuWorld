name: Deploy Fullstack to AWS Lightsail

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Caddyfile'

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/vippro67/guworld-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # build-frontend:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4

  #     - name: Log in to GHCR
  #       uses: docker/login-action@v3
  #       with:
  #         registry: ghcr.io
  #         username: ${{ github.actor }}
  #         password: ${{ secrets.GITHUB_TOKEN }}

  #     - name: Set up Docker Buildx
  #       uses: docker/setup-buildx-action@v3

  #     - name: Build & Push Frontend Image
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: ./frontend
  #         push: true
  #         tags: ghcr.io/vippro67/guworld-frontend:latest
  #         build-args: |
  #           NEXT_PUBLIC_BACKEND_URL=https://api.cogioi.io.vn
  #         cache-from: type=gha
  #         cache-to: type=gha,mode=max

  deploy:
    # needs: [build-backend, build-frontend]
    needs: [build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            cd /home/${{ secrets.LIGHTSAIL_USERNAME }}/GuWorld
            git pull origin master
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull backend
            docker compose up -d --remove-orphans