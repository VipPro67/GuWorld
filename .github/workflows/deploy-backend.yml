name: Deploy Backend to AWS Lightsail

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - 'Caddyfile'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: 22
          script: |
            # Đi vào thư mục dự án trên Lightsail
            cd /home/${{ secrets.LIGHTSAIL_USERNAME }}/GuWorld
            
            # Đồng bộ code mới nhất
            git pull origin master
            
            # Khởi chạy/Rebuild lại toàn bộ dịch vụ (Caddy, Backend, Redis, DB) nếu có thay đổi
            docker compose up -d --build
