name: Quality checks

on:
  pull_request:
    paths:
      - "backend/**"
      # - "frontend/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [deploy]
    paths:
      - "backend/**"
      # - "frontend/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Race (uihub)
        working-directory: backend
        run: go test -race ./internal/uihub/...

