name: Quality checks

on:
  pull_request:
    paths:
      - "backend/**"
      # - "frontend/**"
      - "docs/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [deploy]
    paths:
      - "backend/**"
      # - "frontend/**"
      - "docs/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format (realtime surface)
        working-directory: backend
        run: test -z "$(gofmt -l internal/realtime internal/ws internal/handlers/monitor.go internal/server/server.go cmd/server cmd/mmo_slice cmd/mmo_bench cmd/gudata internal/db/schema_realtime.go)"
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Test
        working-directory: backend
        run: go test ./...
      - name: Race (realtime/ws)
        working-directory: backend
        run: go test -race ./internal/realtime/... ./internal/ws/...
      - name: Realtime Gu coverage (strict)
        working-directory: backend
        run: go run ./cmd/gudata audit-realtime -data data -strict -csv /tmp/gu-coverage.csv
      - name: Realtime Gu compile
        working-directory: backend
        run: go run ./cmd/gudata compile-realtime-gu -data data -profiles data/mmo/gu/transpiled_profiles.json -report /tmp/gu-compiled.json

